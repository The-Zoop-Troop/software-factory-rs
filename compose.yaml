# One rig. Run `docker/build.sh [runtime]` first; `docker compose up -d` then starts the egress
# proxy, the deterministic roles and a worker; `docker compose run --rm plan --text "..."` submits a plan.
# Requires rootless Docker (ARCHITECTURE.md §6).

# Images are built by `docker/build.sh [runtime]` (base + runtime + egress allowlist); pick one
# with RIG_IMAGE (default: the rust runtime, which this repository itself needs).
# Every rig container's environment; services that add their own keys merge this in.
x-rig-env: &rig-env
  HTTPS_PROXY: http://egress:8888
  HTTP_PROXY: http://egress:8888
  NO_PROXY: localhost,127.0.0.1,egress
  RUST_LOG: info
  # The rig's Dolt server (service `ledger`); the same password on every rig of a host.
  RIG_NAME: ${RIG_NAME:-rig}
  BEADS_DOLT_PASSWORD: ${LEDGER_PASSWORD:-factory}
  LEDGER_PASSWORD: ${LEDGER_PASSWORD:-factory}

x-rig: &rig
  image: ${RIG_IMAGE:-factory-rig:rust}
  # RIG_ENV_FILE: the rig's secrets/env (set by `factory rig create`; single-rig default below).
  env_file:
    - path: ${RIG_ENV_FILE:-docker/rig.env}
      required: false
  environment:
    <<: *rig-env
  volumes:
    - ledger:/work/rig
    - repo:/work/rig/repo
    - cache:/work/cache
  networks: [rig]
  # Blast-radius limits: the realistic failure is a runaway build, not an exploit.
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 2048
  mem_limit: 6g
  cpus: 4
  tmpfs: [/tmp:size=1g]
  depends_on:
    egress: { condition: service_started }
    ledger: { condition: service_healthy }
  restart: unless-stopped

services:
  # One Dolt SQL server per rig over the ledger volume; every role and the console talk to it
  # as `ledger-<rig>` (docs/design-docs/ledger.md).
  ledger:
    <<: *rig
    command: [ledger]
    depends_on: []
    networks:
      rig:
        aliases: ["ledger-${RIG_NAME:-rig}"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3307"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  egress:
    build:
      context: docker
      dockerfile: Dockerfile.egress
    image: factory-egress:dev
    networks: [rig, outside]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 128m
    restart: unless-stopped

  steward:
    <<: *rig
    command: [steward, --interval, "15"]

  verifier:
    <<: *rig
    command: [verify, --interval, "10"]

  integrator:
    <<: *rig
    command: [integrate, --interval, "10"]

  # Scale with `docker compose up -d --scale worker=3`; each gets a distinct lease holder.
  worker:
    <<: *rig
    command: [work, --interval, "10"]
    # RIG_WORKERS replicas share the ledger and cache; leases serialise claims and each replica
    # is its own agent (worker-<container>). Measure with `factory metrics` before raising it.
    deploy:
      replicas: ${RIG_WORKERS:-1}

  # Same image, Codex harness: needs OPENAI_API_KEY (and optionally CODEX_MODEL) in docker/rig.env.
  worker-codex:
    <<: *rig
    environment:
      <<: *rig-env
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1,egress
      RUST_LOG: info
      RIG_HARNESS: codex
    command: [work, --interval, "10"]
    profiles: [codex]

  # Same image, different harness: OpenCode against the provider in docker/rig.env.
  worker-opencode:
    <<: *rig
    environment:
      <<: *rig-env
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1,egress
      RUST_LOG: info
      RIG_HARNESS: opencode
    command: [work, --interval, "10"]
    profiles: [opencode]

  # One-shot roles; run with `docker compose run --rm <name> ...`.
  # Serves the plan queue: plan_request beads left by the console become epics here, so the
  # harness credential stays inside the rig.
  planner:
    <<: *rig
    command: [planner]
    environment:
      <<: *rig-env
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1,egress
      RUST_LOG: info
      RIG_HARNESS: ${PLANNER_HARNESS:-${RIG_HARNESS:-claude}}   # PLANNER_HARNESS overrides the rig harness for planning only

  # Remote control (docs/exec-plans/completed/remote-control.md). Only the console is reachable
  # from outside the rig network, on the loopback port below; put TLS in front for real use.
  # Single-rig console. Opt in with `--profile console`; hosts running several rigs use the shared
  # console from `factory rig console` instead (one process over every rig's ledger).
  console:
    <<: *rig
    command: [console]
    profiles: [console]
    env_file: []   # no provider credentials here, ever
    environment:
      <<: *rig-env
      RIG_NAME: ${RIG_NAME:-toy}
      CONSOLE_URL: ${CONSOLE_URL:-http://127.0.0.1:7700}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ledger:/work/rig
      - ./docker/console:/work/console:ro
    # Published ports do not work on an internal-only network, so the console also joins
    # `outside`; it reaches nothing it needs there (no proxy env, no credentials).
    networks: [rig, outside]
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-7700}:7700"

  # Telegram bot: long-polls api.telegram.org (allowlisted below via the egress proxy) and
  # talks to the console over the rig network. Needs TELEGRAM_BOT_TOKEN, TELEGRAM_CHATS, FACTORY_TOKEN.
  telegram:
    <<: *rig
    command: [telegram]
    env_file: []
    environment:
      <<: *rig-env
      HTTPS_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1,egress,console
      RUST_LOG: ${RUST_LOG:-info}
      RIG_NAME: ${RIG_NAME:-toy}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHATS: ${TELEGRAM_CHATS:-}
      FACTORY_TOKEN: ${FACTORY_TOKEN:-}
    volumes: []
    profiles: [telegram]

  # TLS for the console: `CONSOLE_DOMAIN=console.example.com docker compose --profile tls up -d caddy`.
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    networks: [rig, outside]
    ports: ["80:80", "443:443"]
    environment:
      <<: *rig-env
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  plan:
    <<: *rig
    restart: "no"
    entrypoint: [rig-entrypoint, plan]   # `docker compose run --rm plan --text "..."`
    command: []
    profiles: [tools]

  shell:
    <<: *rig
    restart: "no"
    entrypoint: [rig-entrypoint]         # `docker compose run --rm shell bash -c "..."`
    command: [shell]
    profiles: [tools]

  # Verifier sidecars: opt-in services on the rig network for verify commands that need them.
  # `docker compose --profile postgres up -d postgres`; reachable as postgres:5432 / redis:6379.
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment: { POSTGRES_PASSWORD: factory, POSTGRES_USER: factory, POSTGRES_DB: factory }
    networks: [rig]
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    profiles: [redis]
    networks: [rig]

networks:
  rig:
    internal: true          # no default route: only `egress` can reach outside
  outside: {}

volumes:
  ledger: {}
  repo: {}
  caddy: {} # TLS certificates and Caddy state
  cache: {} # runtime package caches (cargo, uv, pnpm, …) so worktree-per-task stays fast
