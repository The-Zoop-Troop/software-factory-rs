Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 64
# CONNECT only to TLS ports; plain-HTTP proxying is also filtered by domain below.
ConnectPort 443
# Default-deny: only hosts matching /etc/tinyproxy/allowlist may be reached.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterType fnmatch
# Do not add Via/X-Tinyproxy headers that leak the rig's shape.
DisableViaHeader Yes
Allow 0.0.0.0/0
