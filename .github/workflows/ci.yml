name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo deny check
      - run: cargo nextest run --workspace --all-features
      - run: cargo llvm-cov nextest --workspace --exclude xtask --all-features --fail-under-lines 85
      - run: cargo xtask lint-docs
      - run: cargo xtask lint-taste
      - run: cargo xtask gen-docs --check
      - run: cargo xtask lint-fp
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: crates/console/ui/pnpm-lock.yaml }
      - name: Playwright browsers
        run: cd crates/console/ui && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Frontend gate (typecheck, lint, unit+coverage, build, bundle budget, e2e over console --fake)
        run: cargo xtask ui-check --e2e

  rig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: cp docker/egress/allowlist.base docker/egress/allowlist && docker build -q -f docker/Dockerfile.egress docker
      - run: bash -n docker/build.sh docker/runtimes/conformance.sh docker/entrypoint.sh
