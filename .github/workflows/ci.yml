name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy, llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest,cargo-llvm-cov,cargo-deny }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo deny check
      - run: cargo nextest run --workspace --all-features
      - run: cargo llvm-cov nextest --workspace --exclude xtask --all-features --fail-under-lines 85
      - run: cargo xtask lint-docs
      - run: cargo xtask lint-taste
      - run: cargo xtask gen-docs --check
  rig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build egress
