name: runtimes
# Build every rig image, run its conformance test, and (on main) publish to GHCR.
on:
  push:
    branches: [main]
    paths: [docker/**, crates/**, Cargo.*, .github/workflows/runtimes.yml]
  pull_request:
    paths: [docker/**, crates/**, Cargo.*, .github/workflows/runtimes.yml]
  workflow_dispatch:
  schedule: [{ cron: "0 4 * * 1" }]   # weekly rebuild picks up base-image security updates
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [base, rust, python, node, go, jvm, c-cpp, ruby, php, elixir, web-e2e, polyglot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build base + runtime and run conformance
        run: |
          if [ "${{ matrix.runtime }}" = base ]; then docker/build.sh base; else docker/build.sh "${{ matrix.runtime }}" --conformance; fi
      - name: Sandbox invariants hold in this image
        run: |
          img=factory-rig:${{ matrix.runtime }}
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true "$img" bash -c 'test "$(id -u)" = 10001 && grep -qE "^CapEff:\s*0+$" /proc/self/status && echo sandbox-ok'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          rt=${{ matrix.runtime }}
          dst=ghcr.io/the-zoop-troop/rig-$rt
          day=$(date -u +%Y%m%d)
          docker tag factory-rig:$rt "$dst:$day"; docker tag factory-rig:$rt "$dst:latest"
          docker push -q "$dst:$day"; docker push -q "$dst:latest"
          echo "published $dst:$day"
